services:
  web:
    image: nginx:alpine
    container_name: rusc-web
    ports:
      - "8086:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
